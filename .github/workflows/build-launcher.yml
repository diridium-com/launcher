name: Build on every push and every pull-request

on:
  pull_request:
    paths-ignore:
      - "*.md"
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "*.md"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: x86_64-apple-darwin
            args: "--target universal-apple-darwin"
            artifact-name: build-macos-universal
          - platform: ubuntu-latest
            rust-targets: ""
            args: ""
            artifact-name: build-linux-x86_64
          - platform: ubuntu-24.04-arm
            rust-targets: ""
            args: ""
            artifact-name: build-linux-arm64
          - platform: windows-latest
            rust-targets: ""
            args: ""
            artifact-name: build-windows-x86_64
          - platform: windows-11-arm
            rust-targets: ""
            args: ""
            artifact-name: build-windows-arm64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests and lint (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings

      - name: Install cargo-audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust security audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo audit

      - name: Sync node version and setup cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: npm security audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        # npm audit has no ignore list, so this filters its JSON report. It fails
        # on any high or critical advisory not in ALLOWED, on an ALLOWED advisory
        # that is no longer reported, and when npm audit produces no report.
        #
        # ALLOWED, checked 2026-10-22. Both advisories cover every published
        # version and have no patched release, and both packages are Nuxt build
        # and dev-server dependencies. Once a fix ships and the lockfile picks it
        # up, this step fails until the ID is removed.
        #   GHSA-vfj7-8cjw-p6xm  braces, via micromatch, fast-glob and nitropack
        #   GHSA-86w9-cpqp-85rv  node-forge, via listhen and @nuxt/cli
        env:
          ALLOWED: GHSA-vfj7-8cjw-p6xm GHSA-86w9-cpqp-85rv
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP:-/tmp}/npm-audit.json"
          # npm audit exits non-zero whenever it finds anything, so the report decides.
          npm audit --json > "$report" || true
          if ! jq -e '.vulnerabilities | type == "object"' "$report" > /dev/null 2>&1; then
            echo "::error::npm audit did not produce a report"
            cat "$report"
            exit 1
          fi
          # One line per high or critical advisory: id, the packages it flags, title. A
          # package flagged only through one of its dependencies carries no advisory of
          # its own, so it adds nothing here. An advisory without a GHSA id is listed by
          # its URL or source number, which is never in ALLOWED, so it fails.
          jq -r '
            [.vulnerabilities[].via[] | objects
             | select(.severity == "high" or .severity == "critical")
             | (.url // (.source | tostring)) as $u
             | {id: (($u | capture("(?<id>GHSA(-[0-9a-z]{4}){3})") | .id) // $u), name, title}]
            | group_by(.id) | .[]
            | "\(.[0].id)\t\(map(.name) | unique | join(", "))\t\(.[0].title)"' "$report" > "$report.found"
          status=0
          while IFS=$'\t' read -r id name title; do
            case " $ALLOWED " in
              *" $id "*) echo "allowed: $id ($name)" ;;
              *) echo "::error::$id $name: $title"; status=1 ;;
            esac
          done < "$report.found"
          for id in $ALLOWED; do
            if ! awk -F'\t' -v id="$id" '$1 == id { found = 1 } END { exit !found }' "$report.found"; then
              echo "::error::$id is no longer reported; remove it from ALLOWED"
              status=1
            fi
          done
          exit $status

      - name: Verify tag matches manifest version
        # tauri-action names and tags the release from the manifest version
        # (package.json), not the pushed tag. If they diverge, the release would
        # be mis-tagged and could clobber an existing one. Fail fast on mismatch.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          manifest="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$manifest" ]; then
            echo "::error::Pushed tag $GITHUB_REF_NAME does not match manifest version $manifest. Bump package.json and src-tauri/Cargo.toml to match the tag."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches manifest $manifest"

      - name: Build the app and release
        # Release ONLY when a version tag (vX.Y.Z) is pushed, not on every master
        # push. Pushing a v* tag builds and drafts a release for that version;
        # regular branch/PR pushes only build (step below). This stops later
        # master merges from re-uploading over an already-published release.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Launcher v__VERSION__"
          releaseBody: |
            See the assets below to download and install this version.

            | File | Platform |
            |------|----------|
            | `Launcher___VERSION___universal.dmg` | macOS (Intel & Apple Silicon) |
            | `Launcher_universal.app.tar.gz` | macOS app bundle (Intel & Apple Silicon) |
            | `Launcher___VERSION___x64-setup.exe` | Windows x64 installer |
            | `Launcher___VERSION___x64_en-US.msi` | Windows x64 MSI |
            | `Launcher___VERSION___arm64-setup.exe` | Windows ARM64 installer |
            | `Launcher___VERSION___arm64_en-US.msi` | Windows ARM64 MSI |
            | `Launcher___VERSION___amd64.AppImage` | Linux x86_64 AppImage |
            | `Launcher___VERSION___amd64.deb` | Linux x86_64 deb |
            | `Launcher-__VERSION__-1.x86_64.rpm` | Linux x86_64 rpm |
            | `Launcher___VERSION___aarch64.AppImage` | Linux ARM64 AppImage |
            | `Launcher___VERSION___arm64.deb` | Linux ARM64 deb |
            | `Launcher-__VERSION__-1.aarch64.rpm` | Linux ARM64 rpm |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build the app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  # Aggregating gate: one stable check to mark as required in branch protection.
  # Green only if every leg of the release matrix succeeded.
  ci-success:
    name: ci-success
    needs: [release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix builds succeeded
        run: |
          if [ "${{ needs.release.result }}" != "success" ]; then
            echo "Matrix build did not succeed: ${{ needs.release.result }}"
            exit 1
          fi
          echo "All matrix builds succeeded."
