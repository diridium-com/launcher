name: Build on every push and every pull-request

on:
  pull_request:
    paths-ignore:
      - "*.md"
  push:
    paths-ignore:
      - "*.md"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: x86_64-apple-darwin
            args: "--target universal-apple-darwin"
            artifact-name: build-macos-universal
          - platform: ubuntu-latest
            rust-targets: ""
            args: ""
            artifact-name: build-linux-x86_64
          - platform: ubuntu-24.04-arm
            rust-targets: ""
            args: ""
            artifact-name: build-linux-arm64
          - platform: windows-latest
            rust-targets: ""
            args: ""
            artifact-name: build-windows-x86_64
          - platform: windows-11-arm
            rust-targets: ""
            args: ""
            artifact-name: build-windows-arm64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests and lint (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings

      - name: Install cargo-audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust security audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        # RUSTSEC-2026-0194 and -0195 are quick-xml DoS advisories. The only vulnerable
        # copy (0.39.4) is pulled at build time by wayland-scanner on Linux, which parses
        # trusted bundled protocol XML, not runtime input, so it is not reachable. See
        # issue #10. Remove these ignores once arboard pulls quick-xml >= 0.41.0.
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: npm security audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: npm audit --audit-level=high

      - name: Build the app and release
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Launcher v__VERSION__"
          releaseBody: |
            See the assets below to download and install this version.

            | File | Platform |
            |------|----------|
            | `Launcher___VERSION___universal.dmg` | macOS (Intel & Apple Silicon) |
            | `Launcher_universal.app.tar.gz` | macOS app bundle (Intel & Apple Silicon) |
            | `Launcher___VERSION___x64-setup.exe` | Windows x64 installer |
            | `Launcher___VERSION___x64_en-US.msi` | Windows x64 MSI |
            | `Launcher___VERSION___arm64-setup.exe` | Windows ARM64 installer |
            | `Launcher___VERSION___arm64_en-US.msi` | Windows ARM64 MSI |
            | `Launcher___VERSION___amd64.AppImage` | Linux x86_64 AppImage |
            | `Launcher___VERSION___amd64.deb` | Linux x86_64 deb |
            | `Launcher-__VERSION__-1.x86_64.rpm` | Linux x86_64 rpm |
            | `Launcher___VERSION___aarch64.AppImage` | Linux ARM64 AppImage |
            | `Launcher___VERSION___arm64.deb` | Linux ARM64 deb |
            | `Launcher-__VERSION__-1.aarch64.rpm` | Linux ARM64 rpm |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build the app
        if: ${{ github.ref != 'refs/heads/master' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  # Aggregating gate: one stable check to mark as required in branch protection.
  # Green only if every leg of the release matrix succeeded.
  ci-success:
    name: ci-success
    needs: [release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix builds succeeded
        run: |
          if [ "${{ needs.release.result }}" != "success" ]; then
            echo "Matrix build did not succeed: ${{ needs.release.result }}"
            exit 1
          fi
          echo "All matrix builds succeeded."
