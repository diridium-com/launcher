name: Build on every push and every pull-request

on:
  pull_request:
    paths-ignore:
      - "*.md"
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "*.md"
  workflow_dispatch:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  # Runs once, on Linux, before any build. The release step below runs on five
  # runners with fail-fast off, so a guard inside that matrix could fail on one
  # runner while the other four still uploaded. On a branch or PR push every
  # step is skipped and the job passes.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Refuse a tag whose release is already published
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>&1)"; then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Its files are never replaced; release a new version."
              exit 1
            fi
            echo "A draft exists for ${GITHUB_REF_NAME}; the build will update it."
          elif [ "$DRAFT" = "release not found" ]; then
            # This job's token is read-only, and GitHub hides drafts from it, so
            # an existing draft also lands here. Only a published release has to
            # be refused, and a published release is always visible.
            echo "No published release exists for ${GITHUB_REF_NAME}."
          else
            # Anything else (network, permissions) must not be taken for "no release".
            echo "::error::Could not check for an existing release: $DRAFT"
            exit 1
          fi

      - name: Check the tag against every version file
        # tauri-action names and tags the release from package.json, not from
        # the pushed tag, so a mismatch would mis-tag the release.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is version ${VERSION}, but $1 says '$2'."
              FAILED=1
            fi
          }
          FAILED=0
          check "package.json version" "$(jq -r .version package.json)"
          check "package-lock.json version" "$(jq -r .version package-lock.json)"
          check "package-lock.json packages[\"\"].version" \
            "$(jq -r '.packages[""].version' package-lock.json)"
          check "src-tauri/Cargo.toml version" \
            "$(awk '/^\[/ { p = ($0 == "[package]") } p && /^version = / { gsub(/"/, "", $3); print $3; exit }' src-tauri/Cargo.toml)"
          check "src-tauri/Cargo.lock launcher version" \
            "$(awk '$0 == "name = \"launcher\"" { getline; gsub(/"/, "", $3); print $3; exit }' src-tauri/Cargo.lock)"
          if [ "$FAILED" -ne 0 ]; then
            echo "Set the version in every file listed above (RELEASING.md, step 1) and tag again."
            exit 1
          fi

  release:
    needs: guard
    # Write access is for tauri-action creating the draft release on a tag push.
    # Branch and PR builds hold it too, until building and releasing are split
    # into separate jobs.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: x86_64-apple-darwin
            args: "--target universal-apple-darwin"
            artifact-name: build-macos-universal
          - platform: ubuntu-latest
            rust-targets: ""
            args: ""
            artifact-name: build-linux-x86_64
          - platform: ubuntu-24.04-arm
            rust-targets: ""
            args: ""
            artifact-name: build-linux-arm64
          - platform: windows-latest
            rust-targets: ""
            args: ""
            artifact-name: build-windows-x86_64
          - platform: windows-11-arm
            rust-targets: ""
            args: ""
            artifact-name: build-windows-arm64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        # Pinned to the stable branch as of 2026-10-09, its newest commit at least
        # 14 days old on 2026-10-23. Pinned by commit, the action can't read the
        # toolchain from the ref name, so it is named below.
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests and lint (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings

      - name: Install cargo-audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit

      - name: Rust security audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo audit

      - name: Sync node version and setup cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Without this, setup-node uses whatever 24.x the runner image already
          # has. On 2026-10-22 that was 24.21.0 on macOS and Linux, which
          # CVE-2026-111497 (Node2Shell, fixed in 24.22.1) affects. Taking a
          # Node release younger than 14 days is the security exception to the
          # 14-day wait: 24.22.1 came out on 2026-10-21 with that fix.
          check-latest: true
          cache: "npm"

      - name: Install frontend dependencies
        # npm ci installs exactly what package-lock.json names and fails if it
        # disagrees with package.json; npm install could resolve something else.
        run: npm ci

      - name: npm security audit (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        # npm audit has no ignore list, so this filters its JSON report. It fails
        # on any high or critical advisory not in ALLOWED, on an ALLOWED advisory
        # that is no longer reported, and when npm audit produces no report.
        #
        # ALLOWED, checked 2026-10-23. The advisory covers every published
        # version and has no patched release, and the package is a Nuxt
        # dev-server dependency. Once a fix ships and the lockfile picks it up,
        # this step fails until the ID is removed.
        #   GHSA-86w9-cpqp-85rv  node-forge, via listhen and @nuxt/cli
        # (GHSA-vfj7-8cjw-p6xm, braces, was allowed until GitHub withdrew it on
        # 2026-10-23.)
        env:
          ALLOWED: GHSA-86w9-cpqp-85rv
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP:-/tmp}/npm-audit.json"
          # npm audit exits non-zero whenever it finds anything, so the report decides.
          npm audit --json > "$report" || true
          if ! jq -e '.vulnerabilities | type == "object"' "$report" > /dev/null 2>&1; then
            echo "::error::npm audit did not produce a report"
            cat "$report"
            exit 1
          fi
          # One line per high or critical advisory: id, the packages it flags, title. A
          # package flagged only through one of its dependencies carries no advisory of
          # its own, so it adds nothing here. An advisory without a GHSA id is listed by
          # its URL or source number, which is never in ALLOWED, so it fails.
          jq -r '
            [.vulnerabilities[].via[] | objects
             | select(.severity == "high" or .severity == "critical")
             | (.url // (.source | tostring)) as $u
             | {id: (($u | capture("(?<id>GHSA(-[0-9a-z]{4}){3})") | .id) // $u), name, title}]
            | group_by(.id) | .[]
            | "\(.[0].id)\t\(map(.name) | unique | join(", "))\t\(.[0].title)"' "$report" > "$report.found"
          status=0
          while IFS=$'\t' read -r id name title; do
            case " $ALLOWED " in
              *" $id "*) echo "allowed: $id ($name)" ;;
              *) echo "::error::$id $name: $title"; status=1 ;;
            esac
          done < "$report.found"
          for id in $ALLOWED; do
            if ! awk -F'\t' -v id="$id" '$1 == id { found = 1 } END { exit !found }' "$report.found"; then
              echo "::error::$id is no longer reported; remove it from ALLOWED"
              status=1
            fi
          done
          exit $status

      - name: Build the app and release
        # Release ONLY when a version tag (vX.Y.Z) is pushed, not on every master
        # push. Pushing a v* tag builds and drafts a release for that version;
        # regular branch/PR pushes only build (step below). This stops later
        # master merges from re-uploading over an already-published release.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Launcher v__VERSION__"
          releaseBody: |
            See the assets below to download and install this version.

            | File | Platform |
            |------|----------|
            | `Launcher___VERSION___universal.dmg` | macOS (Intel & Apple Silicon) |
            | `Launcher_universal.app.tar.gz` | macOS app bundle (Intel & Apple Silicon) |
            | `Launcher___VERSION___x64-setup.exe` | Windows x64 installer |
            | `Launcher___VERSION___x64_en-US.msi` | Windows x64 MSI |
            | `Launcher___VERSION___arm64-setup.exe` | Windows ARM64 installer |
            | `Launcher___VERSION___arm64_en-US.msi` | Windows ARM64 MSI |
            | `Launcher___VERSION___amd64.AppImage` | Linux x86_64 AppImage |
            | `Launcher___VERSION___amd64.deb` | Linux x86_64 deb |
            | `Launcher-__VERSION__-1.x86_64.rpm` | Linux x86_64 rpm |
            | `Launcher___VERSION___aarch64.AppImage` | Linux ARM64 AppImage |
            | `Launcher___VERSION___arm64.deb` | Linux ARM64 deb |
            | `Launcher-__VERSION__-1.aarch64.rpm` | Linux ARM64 rpm |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build the app
        # No token: with no tagName or releaseId, tauri-action only builds.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          args: ${{ matrix.args }}

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  # Aggregating gate: one stable check to mark as required in branch protection.
  # Green only if the guard and every leg of the release matrix succeeded.
  ci-success:
    name: ci-success
    needs: [guard, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the guard and all matrix builds succeeded
        run: |
          if [ "${{ needs.guard.result }}" != "success" ] || [ "${{ needs.release.result }}" != "success" ]; then
            echo "Guard: ${{ needs.guard.result }}, matrix builds: ${{ needs.release.result }}"
            exit 1
          fi
          echo "Guard and all matrix builds succeeded."
